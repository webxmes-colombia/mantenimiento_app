version: "3.9"

services:

  mysql:
    image: mysql:8.0
    container_name: mysql
    restart: always

    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: mantenimiento_db

    ports:
      - "3306:3306"

    volumes:
      - ./database:/docker-entrypoint-initdb.d
      - mysql_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: phpmyadmin
    restart: always

    depends_on:
      - mysql

    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: rootpassword

    ports:
      - "8080:80"

  flask:
    build: .
    container_name: flask

    restart: always

    depends_on:
      - mysql

    ports:
      - "5000:5000"

volumes:
  mysql_data: