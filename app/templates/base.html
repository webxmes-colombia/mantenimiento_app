<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>

        {% block titulo %}

        Sistema Control Mantenimiento v2.0

        {% endblock %}

    </title>

    <!-- Bootstrap -->

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Bootstrap Icons -->

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Estilos -->

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

<div class="wrapper">

    <!-- ========================= -->
    <!-- SIDEBAR -->
    <!-- ========================= -->

    <aside class="sidebar">

        <div class="logo">

            <img src="{{ url_for('static', filename='img/logo.png') }}">

        </div>

        <hr>

        <ul>

            <li>

                <a href="#">

                    <i class="bi bi-speedometer2"></i>

                    Dashboard

                </a>

            </li>

            <li>

                <a href="#">

                    <i class="bi bi-people-fill"></i>

                    Clientes

                </a>

            </li>

            <li>

                <a href="#">

                    <i class="bi bi-pc-display"></i>

                    Equipos

                </a>

            </li>

            <li>

                <a href="#">

                    <i class="bi bi-tools"></i>

                    Mantenimientos

                </a>

            </li>

            <li>

                <a href="#">

                    <i class="bi bi-clipboard-data"></i>

                    Reportes

                </a>

            </li>

            <li>

                <a href="#">

                    <i class="bi bi-clock-history"></i>

                    Auditoría

                </a>

            </li>

            <li>

                <a href="#">

                    <i class="bi bi-box-arrow-right"></i>

                    Cerrar sesión

                </a>

            </li>

        </ul>

    </aside>

    <!-- ========================= -->
    <!-- CONTENIDO -->
    <!-- ========================= -->

    <main class="contenido">

        <!-- HEADER -->

        <header class="topbar">

            <h2>

                Sistema Control Mantenimiento

                <span class="version">

                    v2.0

                </span>

            </h2>

        </header>

        <!-- CONTENIDO DINÁMICO -->

        <section class="contenido-principal">

            {% block contenido %}

            {% endblock %}

        </section>

        <!-- FOOTER -->

        <footer>

            <div>

                🌐

                www.cmlabtec.com

            </div>

            <div>

                ☎

                3118120925

            </div>

            <div>

                ✉

                soporte@cmlabtec.com

            </div>

        </footer>

    </main>

</div>

</body>

</html>
